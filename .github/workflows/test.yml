name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: 前端单测与端到端（vitest + jsdom）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 类型检查（src + tests）
        run: npm run test:types

      - name: 单元测试与端到端测试
        run: npm run test

  backend:
    name: 后端文件层（cargo test）
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --quiet
